name: "📐 Грешка в задача, отговор или обяснение"
description: "Използвай този формуляр, ако условие, отговор, оценяване, обяснение, формула или чертеж изглеждат математически неправилни."
title: "[Учебен материал] "
labels:
  - "грешка в задача"
  - "математическа проверка"

body:
  - type: markdown
    attributes:
      value: |
        ## Здравей! 👋

        Благодарим ти, че помагаш учебните материали да бъдат точни.

        Използвай този формуляр, когато смяташ, че в задачата или обяснението има действителна грешка.

        Ако просто не разбираш как се решава задачата, задай въпрос в:

        **Discussions → Въпроси и помощ**

        > ⚠️ **Този сигнал ще бъде публичен.**
        >
        > Не публикувай пълното си име, училище, клас, телефон, личен имейл, пароли, `progress.json`, архив на профила, трансферни файлове или кодове за възстановяване.
        >
        > Не качвай снимки или сканирани страници от учебници, издателски PDF файлове или големи откъси от защитено учебно съдържание.
        >
        > Можеш да копираш текста на конкретната задача от приложението и да опишеш собствените си сметки.

  - type: dropdown
    id: problem-type
    attributes:
      label: "Какъв проблем забеляза?"
      description: "Избери най-близкия отговор."
      options:
        - "Условието е неясно или липсват необходими данни"
        - "Правилният отговор в приложението изглежда грешен"
        - "Приложението отхвърля математически верен отговор"
        - "Приложението приема математически грешен отговор"
        - "Еквивалентен запис не се приема"
        - "Формула, мерна единица или закръгляване изглежда неправилно"
        - "Обяснението съдържа математическа грешка"
        - "Подобният пример съдържа математическа грешка"
        - "Подсказката е грешна или подвеждаща"
        - "Чертежът, таблицата или графиката не съответстват на условието"
        - "Точките или частичното оценяване изглеждат неправилни"
        - "Учебниковото съответствие или официалната връзка са неправилни"
        - "Правописен или визуален проблем без математическа промяна"
        - "Друго"
    validations:
      required: true

  - type: dropdown
    id: app-version
    attributes:
      label: "Коя версия използваш?"
      description: "Версията се вижда в контролния прозорец и в лявата част на приложението."
      options:
        - "v0.5.0"
        - "v0.4.0"
        - "По-стара версия"
        - "Не знам"
    validations:
      required: true

  - type: dropdown
    id: content-area
    attributes:
      label: "Къде се намира проблемът?"
      options:
        - "Материали 41/41"
        - "Интерактивно занятие"
        - "Входна проверка с 3 задачи"
        - "Практическа задача"
        - "Мини тест или седмична проверка"
        - "Входна или сравнителна диагностика"
        - "Пробен изпит"
        - "Обяснение"
        - "Подобен пример"
        - "Подсказка"
        - "Учебниково съответствие"
        - "PDF материал"
        - "Напредък или оценяване"
        - "Друго"
    validations:
      required: true

  - type: input
    id: task-location
    attributes:
      label: "Седмица, занятие и задача"
      description: "Напиши къде точно се намира материалът."
      placeholder: "Например: Седмица 2, Занятие 1, Практика"
    validations:
      required: true

  - type: input
    id: task-id
    attributes:
      label: "Идентификатор на задачата — ако се вижда"
      description: "Обикновено изглежда като PCT-W1-004. Ако не се вижда, напиши „Не се вижда“."
      placeholder: "Например: PCT-W1-004"
    validations:
      required: true

  - type: textarea
    id: exact-content
    attributes:
      label: "Точният текст на задачата или проблемната част"
      description: |
        Копирай само конкретния текст от приложението.

        Не копирай цели страници от учебник и не качвай издателски PDF файлове.
      placeholder: |
        Например:
        Намери 20% от 150.
    validations:
      required: true

  - type: input
    id: entered-answer
    attributes:
      label: "Какъв отговор въведе? — ако е приложимо"
      description: "Напиши само отговора за тази задача. Ако проблемът е в обяснение или чертеж, напиши „Не е приложимо“."
      placeholder: "Например: 30"
    validations:
      required: true

  - type: textarea
    id: application-result
    attributes:
      label: "Какво показа приложението?"
      description: "Опиши оценката, съобщението или резултата, който видя."
      placeholder: |
        Например:
        Приложението отбеляза отговора 30 като грешен и показа, че правилният отговор е 25.
    validations:
      required: true

  - type: textarea
    id: expected-result
    attributes:
      label: "Какъв резултат очакваше?"
      placeholder: |
        Например:
        Очаквах отговорът 30 да бъде приет, защото 20% от 150 са 30.
    validations:
      required: true

  - type: textarea
    id: mathematical-reasoning
    attributes:
      label: "Покажи накратко своите сметки или разсъждение"
      description: |
        Това ще помогне за независимата математическа проверка.

        Ако проблемът не е математически, напиши „Не е приложимо“ и обясни защо.
      placeholder: |
        Например:
        20% = 20/100 = 0,2
        0,2 × 150 = 30
    validations:
      required: true

  - type: dropdown
    id: frequency
    attributes:
      label: "Можеш ли да повториш проблема?"
      options:
        - "Да — появява се всеки път"
        - "Появи се повече от веднъж"
        - "Появи се само веднъж"
        - "Не успявам да го повторя"
        - "Не знам"
    validations:
      required: true

  - type: dropdown
    id: impact
    attributes:
      label: "Как ти повлия проблемът?"
      options:
        - "Не мога да продължа със задачата или занятието"
        - "Получих неправилен резултат или загубих точки"
        - "Материалът се отключи или заключи неправилно"
        - "Обяснението ме обърка, но мога да продължа"
        - "Проблемът е само визуален или правописен"
        - "Не съм сигурен"
    validations:
      required: true

  - type: textarea
    id: screenshot
    attributes:
      label: "Снимка на проблема — по избор"
      description: |
        Можеш да плъзнеш снимка в това поле.

        Покажи само проблемната част от приложението.

        Преди качване скрий пълното си име, училище, имейл, имена на лични папки и други лични данни.

        Не качвай снимка на страница от учебник, издателски PDF, progress.json, архив или код за възстановяване.
      placeholder: "Плъзни снимката тук или остави полето празно."

  - type: checkboxes
    id: content-confirmation
    attributes:
      label: "Проверка на сигнала"
      options:
        - label: "Проверих идентификатора или точното място на задачата."
          required: true
        - label: "Описах защо смятам, че има грешка, а не само че задачата е трудна."
          required: true

  - type: checkboxes
    id: privacy-confirmation
    attributes:
      label: "Проверка за поверителност и авторски права"
      options:
        - label: "Текстът и снимките не съдържат пълно име, училище, телефон, имейл, парола или друга лична информация."
          required: true
        - label: "Не прикачвам progress.json, архив на профила, transfer/recovery файл или код за възстановяване."
          required: true
        - label: "Не прикачвам снимки, сканирани страници или PDF файлове от учебник."
          required: true
