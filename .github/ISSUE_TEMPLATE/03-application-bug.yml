name: "🐞 Грешка в програмата"
description: "Използвай този формуляр, когато приложението е инсталирано, но екран, бутон, записване или друга функция не работи правилно."
title: "[Грешка] "
labels:
  - "технически проблем"

body:
  - type: markdown
    attributes:
      value: |
        ## Здравей! 👋

        Благодарим ти, че помагаш приложението да стане по-добро.

        Не е нужно да знаеш техническото име на проблема. Разкажи какво направи, какво очакваше и какво се случи.

        > ⚠️ **Този сигнал ще бъде публичен.**
        >
        > Не публикувай пълното си име, училище, клас, телефон, личен имейл, пароли, `progress.json`, архив на профила, трансферни файлове или кодове за възстановяване.
        >
        > При снимка скрий и имената на личните папки, ако съдържат твоето име.

  - type: dropdown
    id: problem-area
    attributes:
      label: "Къде в приложението възникна проблемът?"
      description: "Избери най-близкия раздел."
      options:
        - "Начало"
        - "Материали 41/41"
        - "Учебни седмици"
        - "Годишна програма"
        - "Входна диагностика или друга проверка"
        - "Входна проверка с 3 задачи"
        - "Практическа задача"
        - "Обяснение, подобен пример, учебник или подсказка"
        - "Напредък"
        - "Архив и настройки"
        - "Архивиране или прехвърляне на профил"
        - "PDF материал"
        - "Контролният прозорец"
        - "Спиране на приложението"
        - "Друго"
    validations:
      required: true

  - type: dropdown
    id: app-version
    attributes:
      label: "Коя версия използваш?"
      description: "Версията се вижда в контролния прозорец и в лявата част на приложението."
      options:
        - "v0.5.0"
        - "v0.4.0"
        - "По-стара версия"
        - "Не знам"
    validations:
      required: true

  - type: dropdown
    id: windows-version
    attributes:
      label: "Коя версия на Windows използваш?"
      options:
        - "Windows 11"
        - "Windows 10"
        - "Друга версия на Windows"
        - "Не знам"
    validations:
      required: true

  - type: dropdown
    id: browser
    attributes:
      label: "В кой браузър се появи проблемът?"
      options:
        - "Google Chrome"
        - "Mozilla Firefox"
        - "Microsoft Edge"
        - "Друг браузър"
        - "Проблемът е в контролния прозорец, не в браузъра"
        - "Не знам"
    validations:
      required: true

  - type: dropdown
    id: internet-state
    attributes:
      label: "Имаше ли интернет връзка?"
      options:
        - "Да"
        - "Не — работех офлайн"
        - "Връзката беше нестабилна"
        - "Не знам"
        - "Няма значение за този проблем"
    validations:
      required: true

  - type: dropdown
    id: frequency
    attributes:
      label: "Колко често се появява проблемът?"
      options:
        - "Всеки път"
        - "Появи се няколко пъти"
        - "Появи се само веднъж"
        - "Не успявам да го повторя"
        - "Не знам"
    validations:
      required: true

  - type: dropdown
    id: can-continue
    attributes:
      label: "Можеш ли да продължиш да използваш приложението?"
      options:
        - "Да — проблемът е малък"
        - "Да, но част от приложението не работи"
        - "Не — текущата задача или раздел е блокиран"
        - "Не — цялото приложение е блокирано"
        - "Приложението се затваря"
        - "Не знам"
    validations:
      required: true

  - type: dropdown
    id: data-impact
    attributes:
      label: "Засегнати ли са профилът или записаните резултати?"
      options:
        - "Не — профилът и резултатите са налични"
        - "Нова промяна не се запазва"
        - "Липсват някои стари отговори или резултати"
        - "Последното учебно място е променено"
        - "Профилът не се вижда"
        - "Не мога да проверя"
        - "Не знам"
    validations:
      required: true

  - type: input
    id: location-details
    attributes:
      label: "Седмица, занятие или задача — ако е приложимо"
      description: "Напиши само идентификатора или мястото в приложението. Не публикувай свой отговор."
      placeholder: "Например: Седмица 2, Занятие 1, задача PCT-W1-004"

  - type: textarea
    id: what-happened
    attributes:
      label: "Какво се случи?"
      description: "Опиши видимия проблем със свои думи."
      placeholder: |
        Например:
        Натиснах „Обяснение“, но панелът не се отвори. Бутонът остана натиснат и нищо друго не се случи.
    validations:
      required: true

  - type: textarea
    id: expected-result
    attributes:
      label: "Какво очакваше да се случи?"
      placeholder: |
        Например:
        Очаквах вдясно да се отвори учебният панел с обяснението на задачата.
    validations:
      required: true

  - type: textarea
    id: reproduction-steps
    attributes:
      label: "Как можем да повторим проблема?"
      description: "Опиши действията в точния им ред."
      placeholder: |
        1. Стартирах приложението.
        2. Отворих „Учебни седмици“.
        3. Избрах Седмица 2, Занятие 1.
        4. Отворих „Практика“.
        5. Натиснах „Обяснение“.
        6. Появи се...
    validations:
      required: true

  - type: textarea
    id: exact-error
    attributes:
      label: "Точният текст на грешката"
      description: "Копирай текста точно. Ако няма съобщение, напиши „Няма“."
      placeholder: |
        Например:
        Възникна грешка при записването.

        Или:
        Няма текстова грешка — бутонът просто не реагира.
    validations:
      required: true

  - type: textarea
    id: workaround
    attributes:
      label: "Успя ли временно да заобиколиш проблема?"
      description: "Например чрез F5, рестартиране или друг браузър. Ако не си опитвал, напиши „Не“."
      placeholder: |
        Например:
        След F5 панелът се отвори, но проблемът се появи отново при следващата задача.
    validations:
      required: true

  - type: textarea
    id: screenshot
    attributes:
      label: "Снимка на проблема — по избор"
      description: |
        Можеш да плъзнеш снимка в това поле.

        Преди качване скрий пълното си име, училище, имейл, имена на лични папки и други лични данни.

        Не качвай `progress.json`, архив на профила, transfer/recovery файл или код за възстановяване.
      placeholder: "Плъзни снимката тук или остави полето празно."

  - type: checkboxes
    id: basic-checks
    attributes:
      label: "Какво вече провери?"
      description: "Отбележи само действията, които действително си направил."
      options:
        - label: "Изчаках да се появи „Запазено“, когато проблемът е свързан със записване."
        - label: "Опитах F5 или повторно отваряне на раздела."
        - label: "Спрях и стартирах приложението безопасно."
        - label: "Проверих дали проблемът се появява и в друг браузър."

  - type: checkboxes
    id: privacy-confirmation
    attributes:
      label: "Проверка за поверителност"
      options:
        - label: "Проверих, че текстът и снимките не съдържат пълно име, училище, телефон, имейл, парола или друга лична информация."
          required: true
        - label: "Не прикачвам progress.json, архив на профила, transfer/recovery файл или код за възстановяване."
          required: true

  - type: checkboxes
    id: final-confirmation
    attributes:
      label: "Последна проверка"
      options:
        - label: "Описах какво направих, какво очаквах и какво се случи."
          required: true
